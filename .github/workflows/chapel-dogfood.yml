name: Chapel Dogfood CI (Cacheable Lane)

on:
  # Manual until Dell-7810 can truthfully reach the shared GloriousFlywheel
  # tinyland-nix lane through org/enterprise shared scope. Auto-triggering this
  # personal-account repo currently only creates runner=null queue debt.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chapel-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-probe:
    name: Dogfood build/capture lane (cacheable, not honey evidence)
    runs-on: tinyland-nix
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Log in determinate-nixd to FlakeHub
        if: ${{ runner.environment != 'github-hosted' }}
        continue-on-error: true
        run: determinate-nixd login github-action

      - uses: DeterminateSystems/flakehub-cache-action@v3
        continue-on-error: true
        with:
          startup-notification-port: 41240
          listen: 127.0.0.1:37540
        env:
          HOME: ${{ runner.temp }}/flakehub-home

      - name: Run canonical Chapel analysis CI helper
        run: bash scripts/platform/run-chapel-analysis-ci

      - name: Record built output paths
        run: |
          mkdir -p "${RUNNER_TEMP}/chapel"
          nix path-info --json ./result-chapel ./result-chapel-capture \
            > "${RUNNER_TEMP}/chapel/chapel-output-paths.json"
          {
            echo "### Chapel dogfood outputs"
            echo
            echo "- \`chapel\`: $(readlink result-chapel)"
            echo "- \`chapel-capture\`: $(readlink result-chapel-capture)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate canonical runner-local capture path
        run: |
          mkdir -p "${RUNNER_TEMP}/chapel"
          bash scripts/platform/capture-chapel-host-probe-local --tag gha-dogfood \
            > "${RUNNER_TEMP}/chapel/chapel-runner-local-capture-gha-dogfood.txt"
          grep -q '^== HostNumaProbe ==$' "${RUNNER_TEMP}/chapel/chapel-runner-local-capture-gha-dogfood.txt"
          grep -q '^Locales:' "${RUNNER_TEMP}/chapel/chapel-runner-local-capture-gha-dogfood.txt"

      - name: Upload dogfood artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chapel-dogfood-capture-artifacts
          path: |
            ${{ runner.temp }}/chapel/chapel-runner-local-capture-gha-dogfood.txt
            ${{ runner.temp }}/chapel/chapel-output-paths.json
          retention-days: 14

  publish:
    name: Publish Chapel flake outputs to FlakeHub
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-probe]
    runs-on: tinyland-nix
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-push@main
        with:
          rolling: true
          visibility: private
          include-output-paths: true
