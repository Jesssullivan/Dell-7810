name: Chapel Analysis Tests

on:
  push:
    paths:
      - 'analysis/**'
      - 'nix/packages/chapel.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/platform/run-chapel-analysis-ci'
      - '.github/workflows/chapel-ci.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'nix/packages/chapel.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/platform/run-chapel-analysis-ci'
      - '.github/workflows/chapel-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Chapel dogfood build/test lane
    runs-on:
      - self-hosted
      - linux
      - x64
      - honey
      - tinyland-nix
      - nix
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
        continue-on-error: true
      - run: bash scripts/platform/run-chapel-analysis-ci
